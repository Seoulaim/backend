# dev 서버 구성: 앱 + PostGIS + Redis
# 같은 폴더의 .env 를 읽음 (서버에만 존재, 저장소에 올리지 않음)
# t3.micro(1GB) 기준 메모리 상한 → 합계 약 750MB, 나머지는 OS·swap
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: seoulaim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    # 소규모 메모리 설정 (기본값 대비 버퍼·연결 수 축소)
    command: >
      postgres
      -c timezone=UTC
      -c shared_buffers=64MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=192MB
      -c max_connections=30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: seoulaim-redis
    restart: unless-stopped
    # OTP·refresh token 용도 → 32MB 로 충분
    command: redis-server --maxmemory 32mb --maxmemory-policy noeviction
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/seoulaim/seoulaim-api:dev
    container_name: seoulaim-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # DB 연결 수 축소 (postgres max_connections 30 안에서 여유)
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      # Dockerfile 의 JAVA_TOOL_OPTIONS 를 덮어씀 → 시간대 설정 포함 필수
      JAVA_TOOL_OPTIONS: >-
        -Duser.timezone=UTC
        -Xms128m -Xmx320m
        -XX:MaxMetaspaceSize=160m
        -XX:ReservedCodeCacheSize=48m
        -Xss512k
        -XX:+UseSerialGC
        -XX:TieredStopAtLevel=1
    mem_limit: 512m
    ports:
      - "8080:8080"

volumes:
  postgres-data: