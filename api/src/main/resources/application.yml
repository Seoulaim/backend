spring:
  application:
    name: seoulaim-api

  profiles:
    default: local

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  jackson:
    serialization:
      write-dates-as-timestamps: false