spring:
  application:
    name: seoulaim-api

  profiles:
    default: local

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  admin:
    # 관리자 API 임시 인증 키 (X-Admin-Key)
    key: ${ADMIN_KEY}
  cors:
    # 웹 클라이언트 origin, 쉼표로 구분 (기본값: 로컬 React 개발 서버)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    # 비어 있으면 AWS 기본 S3 엔드포인트를 쓴다
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${AWS_REGION}
    bucket: ${STORAGE_BUCKET}
    # 비어 있으면 AWS 기본 자격증명 체인(AWS_ACCESS_KEY_ID 등 환경변수, IAM role)을 쓴다
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style-access: false
  order:
    # 배송비 (원). 서울 단일 권역이라 고정
    shipping-fee: ${ORDER_SHIPPING_FEE:3000}
  diary:
    # 유료 다이어리 1권 가격 (원)
    price: ${DIARY_PRICE:3000}
    # 첫 무료 다이어리에서 결제 없이 저장할 수 있는 최대 spread 수
    free-spreads: ${DIARY_FREE_SPREADS:2}
    # 유료 다이어리 1권 가격 (달러, 소수 2자리). PayPal(외화 MID) 결제 금액
    price-usd: ${DIARY_PRICE_USD:2.99}
  payment:
    toss:
      # 토스페이먼츠 시크릿 키. 모든 프로파일에서 환경변수 필수 (기본값 없음)
      secret-key: ${TOSS_SECRET_KEY}
      # 원화 MID (카드, 결제창 v1). 결제창 SDK 에 내려주는 클라이언트 키
      client-key: ${TOSS_CLIENT_KEY:}
      # 외화 MID (PayPal, USD, 결제위젯 v2 키 *_gck_ / *_gsk_). 둘 중 하나라도 비면 PayPal 을 숨긴다
      foreign:
        client-key: ${TOSS_FOREIGN_CLIENT_KEY:}
        secret-key: ${TOSS_FOREIGN_SECRET_KEY:}
        # 결제위젯 PayPal UI 의 variantKey (토스 상점관리자에서 만든 값)
        paypal-variant-key: ${TOSS_PAYPAL_VARIANT_KEY:PAYPAL}
