spring:
  application:
    name: seoulaim-api

  profiles:
    default: local

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  storage:
    # 비어 있으면 AWS 기본 S3 엔드포인트를 쓴다
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${AWS_REGION}
    bucket: ${STORAGE_BUCKET}
    # 비어 있으면 AWS 기본 자격증명 체인(AWS_ACCESS_KEY_ID 등 환경변수, IAM role)을 쓴다
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style-access: false
