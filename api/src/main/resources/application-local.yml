spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seoulaim}
    username: ${DB_USERNAME:seoulaim}
    password: ${DB_PASSWORD:local}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:local-only-secret-do-not-use-in-production-min-256-bits}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

app:
  admin:
    # 관리자 API 임시 인증 키 (X-Admin-Key)
    key: ${ADMIN_KEY:local-admin-key}
  storage:
    # 로컬도 실제 S3 개발용 버킷을 쓴다. endpoint 없음
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${STORAGE_BUCKET:seoulaim-dev-591553897454}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style-access: false
