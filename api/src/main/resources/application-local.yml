spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seoulaim}
    username: ${DB_USERNAME:seoulaim}
    password: ${DB_PASSWORD:local}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}